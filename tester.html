<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choose Module</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--blue:#2f81f7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
main{max-width:1000px;margin:55px auto;padding:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
h1{margin:0}
.back{color:var(--text);text-decoration:none;background:#21262d;border:1px solid var(--line);padding:9px 12px;border-radius:9px;font-weight:800}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.mod{
  min-height:150px;background:var(--panel);border:2px solid var(--line);border-radius:14px;
  text-decoration:none;color:var(--text);display:flex;align-items:center;justify-content:center;
  flex-direction:column;font-size:26px;font-weight:900
}
.mod:hover{border-color:var(--blue);background:#142033}
.mod small{font-size:12px;color:var(--muted);margin-top:7px;font-weight:600}

.access-lock{
  max-width:430px;margin:90px auto;padding:24px;background:#161b22;
  border:1px solid #30363d;border-radius:14px;color:#e6edf3;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif
}
.access-lock h1{margin:0 0 8px;font-size:24px}
.access-lock p{color:#8b949e;margin:0 0 16px}
.access-lock input{
  width:100%;box-sizing:border-box;padding:11px;background:#0d1117;color:#e6edf3;
  border:1px solid #30363d;border-radius:9px;font:inherit;margin-bottom:10px
}
.access-lock button{
  width:100%;padding:11px;background:#2f81f7;color:white;border:1px solid #388bfd;
  border-radius:9px;font:inherit;font-weight:800;cursor:pointer
}
.access-lock-error{color:#f85149;font-size:12px;margin-top:10px;min-height:17px}
.access-locked{display:none!important}


[hidden]{display:none!important}
.mod.disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
.access-lock{max-width:430px;margin:90px auto;padding:24px;background:#161b22;border:1px solid #30363d;border-radius:14px;color:#e6edf3;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.access-lock h1{margin:0 0 8px;font-size:24px}.access-lock p{color:#8b949e;margin:0 0 16px}.access-lock input{width:100%;box-sizing:border-box;padding:11px;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:9px;font:inherit;margin-bottom:10px}.access-lock button{width:100%;padding:11px;background:#2f81f7;color:white;border:1px solid #388bfd;border-radius:9px;font:inherit;font-weight:800;cursor:pointer}.access-lock-error{color:#f85149;font-size:12px;margin-top:10px;min-height:17px}
</style>
</head>
<body>
<div id="testerLock" class="access-lock">
  <h1>Tester Access</h1>
  <div style="color:#2f81f7;font-size:11px;font-weight:800;margin-bottom:8px">ACCESS BUILD V7</div>
  <p>Enter the tester password to view the modules.</p>
  <input id="testerPasswordInput" type="password" autocomplete="off" placeholder="Tester password">
  <button id="testerUnlockBtn" type="button">Unlock Tester</button>
  <div id="testerLockError" class="access-lock-error"></div>
</div>


<div id="testerApp" hidden>
<main>
  <div class="top">
    <h1>Choose Module</h1>
    <a class="back" href="./index.html">← Back</a>
  </div>

  <div class="mods">
    <a class="mod" href="./mod1.html?v=7">MOD 1<small>Open Test</small></a>
    <div class="mod disabled">MOD 2<small>Not Added Yet</small></div>
    <div class="mod disabled">MOD 3<small>Not Added Yet</small></div>
    <div class="mod disabled">MOD 4<small>Not Added Yet</small></div>
    <div class="mod disabled">MOD 5<small>Not Added Yet</small></div>
  </div>
</main>

</div>



<script>
(function(){
 const EXPECTED_HASH="69bbc95c3e3d17f49d4d2ab4e7d429717822c6fbb390351189be6157a0ee7368";
 const lock=document.getElementById("testerLock");
 const app=document.getElementById("testerApp");
 const input=document.getElementById("testerPasswordInput");
 const error=document.getElementById("testerLockError");
 async function sha256(t){const b=new TextEncoder().encode(t);const d=await crypto.subtle.digest("SHA-256",b);return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join("")}
 function show(){lock.hidden=true;app.hidden=false}
 async function unlock(){error.textContent="";const p=input.value; if(await sha256(p)===EXPECTED_HASH){sessionStorage.setItem("flashcard_tester_pass_v7",p);sessionStorage.setItem("flashcard_tester_unlocked_v7","1");input.value="";show()} else {error.textContent="Incorrect password.";input.select()}}
 document.getElementById("testerUnlockBtn").addEventListener("click",unlock);
 input.addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});
 if(sessionStorage.getItem("flashcard_tester_unlocked_v7")==="1" && sessionStorage.getItem("flashcard_tester_pass_v7")) show(); else input.focus();
})();
</script>
</body>
</html>
