<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choose Module</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--blue:#2f81f7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
main{max-width:1000px;margin:55px auto;padding:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
h1{margin:0}
.back{color:var(--text);text-decoration:none;background:#21262d;border:1px solid var(--line);padding:9px 12px;border-radius:9px;font-weight:800}
.mods{display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:16px}
.mod{
  flex:1 1 210px;max-width:300px;min-width:190px;
  min-height:150px;padding:16px;background:var(--panel);border:2px solid var(--line);border-radius:14px;
  text-decoration:none;color:var(--text);display:flex;align-items:center;justify-content:center;
  flex-direction:column;font-size:24px;font-weight:900;
  text-align:center;line-height:1.2;overflow-wrap:anywhere;hyphens:auto
}
.mods-empty{
  flex:1 1 100%;max-width:520px;margin:0 auto;padding:34px 22px;text-align:center;
  background:var(--panel);border:1px dashed var(--line);border-radius:14px
}
.mods-empty strong{display:block;font-size:18px;margin-bottom:6px}
.mods-empty span{color:var(--muted);font-size:14px}
.mod:hover{border-color:var(--blue);background:#142033}
.mod small{font-size:12px;color:var(--muted);margin-top:7px;font-weight:600}

.access-lock{
  max-width:430px;margin:90px auto;padding:24px;background:#161b22;
  border:1px solid #30363d;border-radius:14px;color:#e6edf3;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif
}
.access-lock h1{margin:0 0 8px;font-size:24px}
.access-lock p{color:#8b949e;margin:0 0 16px}
.access-lock input{
  width:100%;box-sizing:border-box;padding:11px;background:#0d1117;color:#e6edf3;
  border:1px solid #30363d;border-radius:9px;font:inherit;margin-bottom:10px
}
.access-lock button{
  width:100%;padding:11px;background:#2f81f7;color:white;border:1px solid #388bfd;
  border-radius:9px;font:inherit;font-weight:800;cursor:pointer
}
.access-lock-error{color:#f85149;font-size:12px;margin-top:10px;min-height:17px}
.access-locked{display:none!important}
.mod-user{color:var(--muted);font-size:12px;font-weight:700}


[hidden]{display:none!important}
.mod.disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
.access-lock{max-width:430px;margin:90px auto;padding:24px;background:#161b22;border:1px solid #30363d;border-radius:14px;color:#e6edf3;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.access-lock h1{margin:0 0 8px;font-size:24px}.access-lock p{color:#8b949e;margin:0 0 16px}.access-lock input{width:100%;box-sizing:border-box;padding:11px;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:9px;font:inherit;margin-bottom:10px}.access-lock button{width:100%;padding:11px;background:#2f81f7;color:white;border:1px solid #388bfd;border-radius:9px;font:inherit;font-weight:800;cursor:pointer}.access-lock-error{color:#f85149;font-size:12px;margin-top:10px;min-height:17px}
</style>
<link rel="stylesheet" href="./theme.css?v=4">
</head>
<body>
<div id="testerLock" class="access-lock" hidden>
  <h1>Tester Access</h1>
  <div style="color:#2f81f7;font-size:11px;font-weight:800;margin-bottom:8px">CLOUD BUILD V8</div>
  <p>Sign in with your tester username and password.</p>
  <input id="testerUsernameInput" type="text" autocomplete="username" placeholder="Username">
  <input id="testerPasswordInput" type="password" autocomplete="current-password" placeholder="Password">
  <button id="testerUnlockBtn" type="button">Sign In</button>
  <div id="testerLockError" class="access-lock-error"></div>
</div>


<div id="testerApp" hidden>
<main>
  <div class="top">
    <h1>Choose Module</h1>
    <div style="display:flex;gap:10px;align-items:center">
      <span id="whoami" class="mod-user"></span>
      <button id="signOutBtn" type="button" class="back" style="cursor:pointer">Sign out</button>
      <a id="backToModes" class="back" href="./index.html" hidden>&#8592; Back</a>
    </div>
  </div>

  <div class="mods" id="modList">
    <div class="mod disabled">Loading<small>Reading your modules</small></div>
  </div>
</main>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="./supabase-config.js"></script>
<script src="./cloud.js"></script>
<script>
(function(){
  const lock=document.getElementById("testerLock");
  const app=document.getElementById("testerApp");
  const user=document.getElementById("testerUsernameInput");
  const pass=document.getElementById("testerPasswordInput");
  const error=document.getElementById("testerLockError");
  const list=document.getElementById("modList");

  function esc(v){
    return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  }
  function showLock(msg){
    app.hidden=true;
    lock.hidden=false;
    error.textContent=msg||"";
    user.focus();
  }
  function showApp(){
    lock.hidden=true;
    app.hidden=false;
  }

  async function renderModules(){
    list.innerHTML='<div class="mod disabled">Loading<small>Reading your modules</small></div>';
    let modules=[];
    try{
      modules=(await FC.listModules()).filter(m=>m.is_published);
    }catch(e){
      list.innerHTML='<div class="mod disabled">Unavailable<small>'+esc(e.message||"Could not load modules")+'</small></div>';
      return;
    }

    if(!modules.length){
      list.innerHTML='<div class="mods-empty"><strong>No modules published yet</strong>'+
        '<span>Publish a module in the developer builder and it will appear here.</span></div>';
      return;
    }

    list.innerHTML=modules.map(m=>
      '<a class="mod" href="./mod1.html?module='+encodeURIComponent(m.slug)+'">'+esc(m.name)+'<small>Open Test</small></a>'
    ).join("");
  }

  async function enter(profile){
    document.getElementById("whoami").textContent=profile.username?("Signed in as "+profile.username):"Signed in";
    /* Only developers get a route back to the mode picker. */
    document.getElementById("backToModes").hidden = (profile.role !== "developer");
    showApp();
    await renderModules();
  }

  async function signIn(){
    error.textContent="";
    try{
      await FC.signIn(user.value,pass.value);
      const profile=await FC.getProfile();
      pass.value="";
      await enter(profile);
    }catch(e){
      await FC.signOut();
      showLock(e.message||"Sign in failed.");
      pass.select();
    }
  }

  document.getElementById("testerUnlockBtn").addEventListener("click",signIn);
  [user,pass].forEach(el=>el.addEventListener("keydown",e=>{if(e.key==="Enter")signIn()}));
  document.getElementById("signOutBtn").addEventListener("click",async()=>{
    await FC.signOut();
    user.value="";pass.value="";
    showLock("");
  });

  (async function boot(){
    let profile=null;
    try{ profile=await FC.requireUser(); }catch(_){ profile=null; }
    if(profile) await enter(profile); else showLock("");
  })();
})();
</script>

<script>
(function(){
  const HEARTBEAT_MS = 30000;
  let timer = null;
  async function beat(){
    try{
      if(!window.FC || !FC.client) return;
      const { data:{ user } } = await FC.client.auth.getUser();
      if(!user) return;
      await FC.client.from("presence").upsert(
        { user_id: user.id, last_seen_at: new Date().toISOString() },
        { onConflict: "user_id" }
      );
    }catch(_){}
  }
  function start(){ if(timer) return; beat(); timer=setInterval(beat,HEARTBEAT_MS); }
  function stop(){ clearInterval(timer); timer=null; }
  document.addEventListener("visibilitychange",()=>{ document.hidden ? stop() : start(); });
  start();
})();
</script>
</body>
</html>
