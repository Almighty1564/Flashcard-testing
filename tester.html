<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choose Module</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--blue:#2f81f7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
main{max-width:1000px;margin:55px auto;padding:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
h1{margin:0}
.back{color:var(--text);text-decoration:none;background:#21262d;border:1px solid var(--line);padding:9px 12px;border-radius:9px;font-weight:800}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.mod{
  min-height:150px;background:var(--panel);border:2px solid var(--line);border-radius:14px;
  text-decoration:none;color:var(--text);display:flex;align-items:center;justify-content:center;
  flex-direction:column;font-size:26px;font-weight:900
}
.mod:hover{border-color:var(--blue);background:#142033}
.mod small{font-size:12px;color:var(--muted);margin-top:7px;font-weight:600}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Choose Module</h1>
    <a class="back" href="./index.html">← Back</a>
  </div>

  <div class="mods">
    <a class="mod" href="./mod1.html">
      MOD 1
      <small>Open Test</small>
    </a>
  </div>
</main>
</body>
</html>
