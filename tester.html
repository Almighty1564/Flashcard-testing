<!doctype html><html><head><title>Tester</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#0f141b;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--blue:#2f81f7;--green:#238636;--red:#da3633;--yellow:#9e6a03}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
main{max-width:1050px;margin:45px auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
input,select,textarea{width:100%;background:#0d1117;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px;font:inherit}
button,.btn{border:1px solid var(--line);background:#21262d;color:var(--text);border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}
.primary{background:var(--blue);border-color:var(--blue);color:white}.good{background:var(--green);border-color:#2ea043;color:white}.bad{background:#491717;border-color:#7d2727}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.muted{color:var(--muted)}.hidden{display:none!important}
.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:12px;color:var(--muted);font-weight:800}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.error{color:#ff7b72;margin-top:10px}.ok{color:#3fb950}.module{min-height:130px;display:flex;flex-direction:column;justify-content:center}
.answer{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}
.stat{background:var(--panel2);border:1px solid var(--line);padding:10px;border-radius:9px}
code{background:#0d1117;border:1px solid var(--line);padding:2px 5px;border-radius:5px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://semtnzdzpluhnkzxkquk.supabase.co";
const SUPABASE_KEY = "sb_publishable__iTA6kUw3yTS1f2W0kfOig_alnmzLcz";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function internalEmail(username){
  return String(username||"").trim().toLowerCase()+"@flashcard.invalid";
}
async function currentUser(){
  const {data:{session}} = await sb.auth.getSession();
  return session?.user || null;
}
async function profileFor(user){
  if(!user) return null;
  const {data,error}=await sb.from("profiles").select("id,username,role").eq("id",user.id).single();
  if(error) throw error;
  return data;
}
async function logout(){
  await sb.auth.signOut();
  location.href="./index.html";
}
</script>
</head><body><main>
<div class="top"><h1>Tester</h1><a class="btn" href="./index.html">← Home</a></div>
<div id="loginCard" class="card">
  <h2>Sign In</h2>
  <div class="field"><label>USERNAME</label><input id="username" autocomplete="username"></div>
  <div class="field"><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password"></div>
  <button class="primary" id="loginBtn">Sign In</button>
  <div id="loginError" class="error"></div>
</div>
<div id="app" class="hidden">
 <div class="card top"><div><h2 style="margin:0">Choose Module</h2><div id="who" class="muted"></div></div><button onclick="logout()">Sign Out</button></div>
 <div id="modules" class="grid"></div>
</div>
<script>
async function showApp(user){
  const profile=await profileFor(user);
  document.getElementById("who").textContent="Signed in as "+(profile.username||"tester");
  document.getElementById("loginCard").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  const {data,error}=await sb.from("modules").select("id,slug,name,description").eq("is_published",true).order("name");
  if(error) throw error;
  const box=document.getElementById("modules");
  box.innerHTML=(data||[]).map(m=>`<div class="card module"><h2>${m.name}</h2><div class="muted">${m.description||""}</div><div style="margin-top:16px"><a class="btn primary" href="./study.html?module=${encodeURIComponent(m.slug)}">Open</a></div></div>`).join("") || '<div class="card">No published modules.</div>';
}
document.getElementById("loginBtn").onclick=async()=>{
  const error=document.getElementById("loginError"); error.textContent="";
  const username=document.getElementById("username").value.trim();
  const password=document.getElementById("password").value;
  const {data, error:authError}=await sb.auth.signInWithPassword({email:internalEmail(username),password});
  if(authError){error.textContent=authError.message;return;}
  try{await showApp(data.user)}catch(e){error.textContent=e.message;}
};
(async()=>{const u=await currentUser(); if(u) await showApp(u);})();
</script></main></body></html>
