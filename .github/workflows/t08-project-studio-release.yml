name: Project Studio release verification
on:
  push:
    branches: ['fix/cs50-project-studio-v2']
permissions:
  contents: write
jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify and apply exact source patch
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib,json,lzma
          blob=b''.join(Path(f'.github/t08-release/part{i}.xz').read_bytes() for i in range(9))
          assert len(blob)==53668
          assert hashlib.sha256(blob).hexdigest()=='a9a75c14fd754f0cf782fa0a803bb52ca88fc0f9c634f527bbad0a7475cfbaaa'
          d=lzma.LZMADecompressor(); raw=d.decompress(blob,max_length=1000000)
          assert d.eof and not d.unused_data
          pack=json.loads(raw)
          assert pack['base_commit']=='ba877ecd9fd7c155e958e7516ee4253e44629c44'
          allowed={'.github/workflows/regression.yml','atelier-portal.js','cs50/app.js','cs50/guides/PROJECT_STUDIO_SETUP.md','cs50/index.html','cs50/projects.html','cs50/studio/README.md','cs50/studio/app.js','cs50/studio/catalog.json','cs50/studio/check_project.py','cs50/studio/core.js','cs50/studio/store.js','cs50/studio/studio.css','cs50/studio/templates.json','index.html','tester.html','tests/project-studio-browser.py','tests/project-studio.test.cjs'}
          assert {e['path'] for e in pack['updates']}==allowed and len(pack['updates'])==len(allowed)
          prepared=[]
          for e in pack['updates']:
              p=Path(e['path']);assert not p.is_symlink()
              if p.exists() and hashlib.sha256(p.read_bytes()).hexdigest()==e['after']:
                  continue
              if e['before'] is None:
                  assert not p.exists(),f'New path already exists: {p}'
                  result=e['content'].encode('utf-8')
              else:
                  old=p.read_bytes();assert hashlib.sha256(old).hexdigest()==e['before'],f'Unexpected base: {p}'
                  lines=old.decode('utf-8').splitlines(keepends=True)
                  for edit in reversed(e['edits']):lines[edit['start']:edit['stop']]=edit['lines']
                  result=''.join(lines).encode('utf-8')
              assert hashlib.sha256(result).hexdigest()==e['after'],f'After hash mismatch: {p}'
              prepared.append((p,result))
          for p,result in prepared:p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(result)
          Path('/tmp/t08-project-paths.txt').write_text('\n'.join(sorted(allowed-{'.github/workflows/regression.yml'}))+'\n')
          print('Verified exact contents of 18 scoped source updates.')
          PY
      - name: Repository tests and syntax
        run: |
          node --test tests/*.test.cjs podcast-media.test.mjs
          node --check cs50/app.js
          node --check cs50/studio/core.js
          node --check cs50/studio/store.js
          node --check cs50/studio/app.js
          python -m py_compile cs50/studio/check_project.py tests/project-studio-browser.py
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Native IndexedDB, CSP and mocked-auth integration
        env:
          T08_TEST_OUTPUT: /tmp/t08-browser-results
        run: python tests/project-studio-browser.py
      - name: Commit verified sources to staging branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --pathspec-from-file=/tmp/t08-project-paths.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Implement Project Studio, recoverable progress, multi-file labs and skill evidence'
            git push origin HEAD:fix/cs50-project-studio-v2
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-studio-browser-verification
          path: /tmp/t08-browser-results
          if-no-files-found: warn
          retention-days: 7
