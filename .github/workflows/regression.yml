name: Regression checks
on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/source-backed-study'
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned development-only database test dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run regression tests and isolated PostgreSQL schema checks
        run: npm test
      - name: Syntax-check reliability scripts
        run: |
          node --check study-reliability.js
          node --check authoring-reliability.js
          node --check atelier-portal.js
          node --check atelier-shell.js
          node --check cloud.js
          node --check cs50/app.js
          node --check cs50/drills/app.js
          node --check cs50/drills/core.js
          node --check cs50/studio/core.js
          node --check cs50/studio/store.js
          node --check cs50/studio/app.js
          node --check security.js
      - name: Syntax-check optional learning capture and pure backend domain
        run: |
          node --check learning-capture.js
          node --check learning-client.js
          node --check learning-workspace.js
          node --check learning-config.js
          node --check learning-authoring.js
          node --check supabase/functions/learning-api/domain.mjs
          node --check supabase/functions/learning-api/backend.mjs
      - name: Package review snapshot
        if: always()
        run: git archive --format=zip --output=source-snapshot.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-snapshot
          path: source-snapshot.zip
          retention-days: 7
