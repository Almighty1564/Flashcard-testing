name: Regression checks
on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression tests
        run: node --test tests/*.test.cjs podcast-media.test.mjs
      - name: Syntax-check reliability scripts
        run: |
          node --check study-reliability.js
          node --check authoring-reliability.js
          node --check atelier-portal.js
          node --check atelier-shell.js
      - name: Package review snapshot
        if: always()
        run: git archive --format=zip --output=source-snapshot.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-snapshot
          path: source-snapshot.zip
          retention-days: 7
