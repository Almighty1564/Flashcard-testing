name: Python Practice staging verification
on:
  push:
    branches: ['fix/python-practice-variations']
    paths: ['.github/t08-drill-release/**', '.github/workflows/t08-drill-release.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply exact reviewed source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,lzma
          blob=b''.join(Path(f'.github/t08-drill-release/part{i}.xz').read_bytes() for i in range(8))
          assert len(blob)==91016
          assert hashlib.sha256(blob).hexdigest()=='36bb70e8f6e1676c98c2996e06e1b04dd62a53f0f399323ee273459cd819117c'
          decoder=lzma.LZMADecompressor(); raw=decoder.decompress(blob,max_length=1000000)
          assert decoder.eof and not decoder.unused_data and len(raw)==592538
          pack=json.loads(raw)
          assert pack['base_commit']=='effecf8ce2b6e379dc364896f81d52e36fee6d84'
          allowed={'.github/workflows/project-studio-browser.yml','.github/workflows/regression.yml','atelier-portal.js','cs50/app.js','cs50/drills/README.md','cs50/drills/SETUP.md','cs50/drills/VERIFICATION.md','cs50/drills/app.js','cs50/drills/check_drill.py','cs50/drills/core.js','cs50/drills/index.json','cs50/drills/packs/addressing.json','cs50/drills/packs/collections.json','cs50/drills/packs/decisions.json','cs50/drills/packs/files.json','cs50/drills/packs/functions.json','cs50/drills/packs/integration.json','cs50/drills/packs/loops.json','cs50/drills/packs/models.json','cs50/drills/packs/reliability.json','cs50/drills/packs/sorting.json','cs50/drills/packs/strings.json','cs50/drills/packs/values.json','cs50/drills/style.css','cs50/index.html','cs50/practice.html','cs50/projects.html','cs50/studio/app.js','cs50/style.css','tester.html','tests/briefing-weather.test.cjs','tests/project-studio-browser.py','tests/python-drills-browser.py','tests/python-drills-runner.py','tests/python-drills.test.cjs'}
          assert {e['path'] for e in pack['updates']}==allowed and len(pack['updates'])==35
          prepared=[]
          for e in pack['updates']:
              p=Path(e['path']); assert not p.is_symlink()
              if p.exists() and hashlib.sha256(p.read_bytes()).hexdigest()==e['after']:continue
              if e['before'] is None:
                  assert not p.exists(),f'Unexpected existing path: {p}'
                  result=e['content'].encode('utf-8')
              else:
                  old=p.read_bytes(); assert hashlib.sha256(old).hexdigest()==e['before'],f'Unexpected base: {p}'
                  lines=old.decode('utf-8').splitlines(keepends=True)
                  for edit in reversed(e['edits']):lines[edit['start']:edit['stop']]=edit['lines']
                  result=''.join(lines).encode('utf-8')
              assert hashlib.sha256(result).hexdigest()==e['after'],f'After fingerprint mismatch: {p}'
              prepared.append((p,result))
          for p,result in prepared:p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(result)
          p=Path('tests/project-studio-browser.py'); text=p.read_text()
          assert hashlib.sha256(text.encode()).hexdigest()=='fc44f081c9e234a5bd67cceb03e270966c2eb8f5d949460c1dc6914547112182'
          old="  # Ledger-level batch conflict must abort atomically.\n  check('Immutable batch collision rejected'"
          new="  # Wait for async initial cloud sync and the diagnostics surface after reload.\n  page.wait_for_function('window.T08Studio?.ledger')\n  # Ledger-level batch conflict must abort atomically.\n  check('Immutable batch collision rejected'"
          assert text.count(old)==1
          text=text.replace(old,new)
          assert hashlib.sha256(text.encode()).hexdigest()=='37fadd97f7e34202e5013bcca19b67e981bb59bedda9e393e6edaec3f8818008'
          p.write_text(text)
          paths=sorted(p for p in allowed if not p.startswith('.github/workflows/'))
          Path('/tmp/t08-drill-paths.txt').write_text('\n'.join(paths)+'\n')
          print('Verified and applied exactly 35 scoped source changes and an explicit reload-test readiness fix.')
          PY
      - name: Repository and checker tests
        run: |
          node --test tests/*.test.cjs podcast-media.test.mjs
          node --check cs50/app.js
          node --check cs50/drills/app.js
          node --check cs50/drills/core.js
          python tests/python-drills-runner.py
      - name: Install native browser tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Existing Studio and new practice browser integration
        env:
          T08_TEST_OUTPUT: /tmp/t08-browser-results
          T08_DRILL_OUTPUT: /tmp/t08-browser-results/drills
        run: |
          mkdir -p /tmp/t08-browser-results
          python tests/project-studio-browser.py 2>&1 | tee /tmp/t08-browser-results/studio-test.log
          python tests/python-drills-browser.py 2>&1 | tee /tmp/t08-browser-results/drill-test.log
      - name: Commit verified application sources to staging only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --pathspec-from-file=/tmp/t08-drill-paths.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Implement 216 Python coding variations and guided Learn Practice Check Apply path'
            git push origin HEAD:fix/python-practice-variations
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-practice-staging-verification
          path: /tmp/t08-browser-results
          if-no-files-found: warn
          retention-days: 7
