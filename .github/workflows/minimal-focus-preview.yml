name: Minimal focus UI preview
on:
  push:
    branches: [ui/minimal-focus-v3]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package source for local UI verification
        run: git archive --format=zip -o "$RUNNER_TEMP/source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: minimal-focus-source
          path: ${{ runner.temp }}/source.zip
          retention-days: 1
