name: Verify official lesson media URLs
on:
  push:
    branches: [ui/lesson-workspace-v4]
    paths: ['.github/workflows/lesson-media-check.yml']
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Resolve official published media links
        run: |
          python - <<'PY'
          import urllib.request,json,concurrent.futures
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          from pathlib import Path
          class Links(HTMLParser):
              def __init__(self):super().__init__();self.urls=[]
              def handle_starttag(self,t,attrs):
                  if t=='a':self.urls.append(dict(attrs).get('href',''))
          units={'scratch':'0','c':'1','arrays':'2','algorithms':'3','memory':'4','structures':'5','python':'6','sql':'7','ai':'ai','web':'8','flask':'9','capstone':'10'}
          def read(item):
              unit,week=item;url='https://cs50.harvard.edu/x/2026/weeks/'+week+'/'
              try:
                  with urllib.request.urlopen(url,timeout=30) as response:html=response.read().decode();final=response.url
                  parser=Links();parser.feed(html)
                  videos=[urljoin(final,x) for x in parser.urls if x.endswith('-720p.mp4') and '/lang/' not in x and 'hdr' not in x.lower()]
                  subtitles=[urljoin(final,x) for x in parser.urls if x.endswith('.srt') and '/en/' in x]
                  return unit,{'source':final,'videos':videos,'subtitles':subtitles}
              except Exception as e:return unit,{'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:result=dict(pool.map(read,units.items()))
          Path('/tmp/official-media.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          assert all(v.get('videos') for v in result.values()),'Official source resolution failed'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: official-media-urls
          path: /tmp/official-media.json
          retention-days: 1
