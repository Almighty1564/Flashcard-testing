name: Connected course staging verification
on:
  push:
    branches: ['fix/course-map-notebook']
    paths: ['.github/t08-path-release/**', '.github/workflows/t08-path-release.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply exact reviewed source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,lzma
          blob=b''.join(Path(f'.github/t08-path-release/part{i}.xz').read_bytes() for i in range(5))
          assert len(blob)==36516
          assert hashlib.sha256(blob).hexdigest()=='c601b13ccf906e3e49ba52be87bb320e9da342c847931a0c5cca40e119d8dbe7'
          decoder=lzma.LZMADecompressor();raw=decoder.decompress(blob,max_length=500000)
          assert decoder.eof and not decoder.unused_data and len(raw)==136047
          pack=json.loads(raw)
          assert pack['base_commit']=='8a8cf9b26e8f8c24525cccfce39c1cd2e93df7ba'
          allowed={'atelier-portal.js','cs50/app.js','cs50/index.html','cs50/practice.html','cs50/projects.html','tester.html','tests/python-drills-browser.py','tests/python-drills.test.cjs','.github/workflows/course-map-browser.yml','cs50/path.html','cs50/path/GUIDE.md','cs50/path/app.js','cs50/path/core.js','cs50/path/data.js','cs50/path/entry.js','cs50/path/notebook.js','cs50/path/notes-core.js','cs50/path/plan.json','cs50/path/shell.js','cs50/path/style.css','tests/course-path-browser.py','tests/course-path.test.cjs'}
          assert len(pack['updates'])==22 and {e['path'] for e in pack['updates']}==allowed
          prepared=[]
          for e in pack['updates']:
              p=Path(e['path']);assert not p.is_symlink()
              if p.exists() and hashlib.sha256(p.read_bytes()).hexdigest()==e['after']:continue
              if e['before'] is None:
                  assert not p.exists(),f'Unexpected existing path: {p}'
                  result=e['content'].encode('utf-8')
              else:
                  old=p.read_bytes();assert hashlib.sha256(old).hexdigest()==e['before'],f'Unexpected base: {p}'
                  lines=old.decode('utf-8').splitlines(keepends=True)
                  for edit in reversed(e['edits']):lines[edit['start']:edit['stop']]=edit['lines']
                  result=''.join(lines).encode('utf-8')
              assert hashlib.sha256(result).hexdigest()==e['after'],f'After fingerprint mismatch: {p}'
              prepared.append((p,result))
          for p,result in prepared:p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(result)
          Path('/tmp/t08-path-files.txt').write_text('\n'.join(sorted(p for p in allowed if not p.startswith('.github/workflows/')))+'\n')
          print('Verified and applied exactly 22 scoped source changes.')
          PY
          python .github/t08-path-release/fixes.py
      - name: Repository and local checker regressions
        run: |
          node --test tests/*.test.cjs podcast-media.test.mjs
          node --check cs50/path/app.js
          node --check cs50/path/notebook.js
          node --check cs50/path/shell.js
          python tests/python-drills-runner.py
      - name: Install native browser tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Course map, notes and existing coursework integration
        env:
          T08_PATH_OUTPUT: /tmp/t08-map-results
          T08_TEST_OUTPUT: /tmp/t08-map-results/studio
          T08_DRILL_OUTPUT: /tmp/t08-map-results/drills
        run: |
          set -o pipefail
          mkdir -p /tmp/t08-map-results/studio /tmp/t08-map-results/drills
          python tests/course-path-browser.py 2>&1 | tee /tmp/t08-map-results/map-log.txt
          python tests/project-studio-browser.py 2>&1 | tee /tmp/t08-map-results/studio-log.txt
          python tests/python-drills-browser.py 2>&1 | tee /tmp/t08-map-results/drills-log.txt
      - name: Commit verified application files to staging only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --pathspec-from-file=/tmp/t08-path-files.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add connected course prerequisites and integrated linked notebook'
            git push origin HEAD:fix/course-map-notebook
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connected-course-staging-verification
          path: /tmp/t08-map-results
          retention-days: 7
