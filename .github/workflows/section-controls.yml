name: Section controls regression
on:
  pull_request:
    paths:
      - 'developer.html'
      - 'authoring-reliability.js'
      - 'cloud.js'
      - 'supabase/migrations/**'
      - 'tests/section-*'
      - '.github/workflows/section-controls.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/section-controls-browser.py
