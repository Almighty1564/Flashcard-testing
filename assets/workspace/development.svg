<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200"><defs><radialGradient id="bg"><stop stop-color="#253e55"/><stop offset="1" stop-color="#081522"/></radialGradient><linearGradient id="screen" x2="1" y2="1"><stop stop-color="#182a3c"/><stop offset="1" stop-color="#07121c"/></linearGradient></defs><rect width="1000" height="1200" fill="url(#bg)"/><g transform="translate(70 -75) rotate(12 600 580)"><rect x="128" y="118" width="1040" height="1020" rx="22" fill="#02080f" stroke="#425c73" stroke-width="4"/><rect x="143" y="132" width="1010" height="991" rx="10" fill="url(#screen)"/><path d="M144 178H1152" stroke="#2b435a"/><circle cx="170" cy="157" r="5" fill="#c8858e"/><circle cx="190" cy="157" r="5" fill="#c9b781"/><circle cx="210" cy="157" r="5" fill="#78a99d"/><text x="273" y="163" fill="#a9bbc9" font-size="17" font-family="monospace">network_tools.py</text><g font-family="monospace"><text x="184" y="230" fill="#426079" font-size="15">01</text><text x="226" y="230" fill="#a0a5e3" font-size="19" xml:space="preserve">import ipaddress</text><text x="184" y="260" fill="#426079" font-size="15">02</text><text x="226" y="260" fill="#a0a5e3" font-size="19" xml:space="preserve">import json</text><text x="184" y="290" fill="#426079" font-size="15">03</text><text x="226" y="290" fill="#aac8dd" font-size="19" xml:space="preserve"></text><text x="184" y="320" fill="#426079" font-size="15">04</text><text x="226" y="320" fill="#a0a5e3" font-size="19" xml:space="preserve">def describe_network(address):</text><text x="184" y="350" fill="#426079" font-size="15">05</text><text x="226" y="350" fill="#aac8dd" font-size="19" xml:space="preserve">    network = ipaddress.ip_network(</text><text x="184" y="380" fill="#426079" font-size="15">06</text><text x="226" y="380" fill="#aac8dd" font-size="19" xml:space="preserve">        address, strict=False</text><text x="184" y="410" fill="#426079" font-size="15">07</text><text x="226" y="410" fill="#aac8dd" font-size="19" xml:space="preserve">    )</text><text x="184" y="440" fill="#426079" font-size="15">08</text><text x="226" y="440" fill="#aac8dd" font-size="19" xml:space="preserve"></text><text x="184" y="470" fill="#426079" font-size="15">09</text><text x="226" y="470" fill="#aac8dd" font-size="19" xml:space="preserve">    return {</text><text x="184" y="500" fill="#426079" font-size="15">10</text><text x="226" y="500" fill="#aac8dd" font-size="19" xml:space="preserve">        &quot;network&quot;: str(network),</text><text x="184" y="530" fill="#426079" font-size="15">11</text><text x="226" y="530" fill="#aac8dd" font-size="19" xml:space="preserve">        &quot;mask&quot;: str(network.netmask),</text><text x="184" y="560" fill="#426079" font-size="15">12</text><text x="226" y="560" fill="#aac8dd" font-size="19" xml:space="preserve">        &quot;broadcast&quot;: str(network.broadcast_address),</text><text x="184" y="590" fill="#426079" font-size="15">13</text><text x="226" y="590" fill="#aac8dd" font-size="19" xml:space="preserve">        &quot;addresses&quot;: network.num_addresses,</text><text x="184" y="620" fill="#426079" font-size="15">14</text><text x="226" y="620" fill="#aac8dd" font-size="19" xml:space="preserve">    }</text><text x="184" y="650" fill="#426079" font-size="15">15</text><text x="226" y="650" fill="#aac8dd" font-size="19" xml:space="preserve"></text><text x="184" y="680" fill="#426079" font-size="15">16</text><text x="226" y="680" fill="#a0a5e3" font-size="19" xml:space="preserve">def export_inventory(networks):</text><text x="184" y="710" fill="#426079" font-size="15">17</text><text x="226" y="710" fill="#aac8dd" font-size="19" xml:space="preserve">    inventory = [</text><text x="184" y="740" fill="#426079" font-size="15">18</text><text x="226" y="740" fill="#aac8dd" font-size="19" xml:space="preserve">        describe_network(item)</text><text x="184" y="770" fill="#426079" font-size="15">19</text><text x="226" y="770" fill="#aac8dd" font-size="19" xml:space="preserve">        for item in networks</text><text x="184" y="800" fill="#426079" font-size="15">20</text><text x="226" y="800" fill="#aac8dd" font-size="19" xml:space="preserve">    ]</text><text x="184" y="830" fill="#426079" font-size="15">21</text><text x="226" y="830" fill="#aac8dd" font-size="19" xml:space="preserve">    return json.dumps(inventory, indent=2)</text><text x="184" y="860" fill="#426079" font-size="15">22</text><text x="226" y="860" fill="#aac8dd" font-size="19" xml:space="preserve"></text><text x="184" y="890" fill="#426079" font-size="15">23</text><text x="226" y="890" fill="#a0a5e3" font-size="19" xml:space="preserve">if __name__ == &quot;__main__&quot;:</text><text x="184" y="920" fill="#426079" font-size="15">24</text><text x="226" y="920" fill="#aac8dd" font-size="19" xml:space="preserve">    ranges = [&quot;172.16.50.0/26&quot;]</text><text x="184" y="950" fill="#426079" font-size="15">25</text><text x="226" y="950" fill="#aac8dd" font-size="19" xml:space="preserve">    print(export_inventory(ranges))</text></g><path d="M227 1000H410M227 1028H660M227 1056H540" stroke="#33546c" stroke-width="7" opacity=".7"/></g></svg>