<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030" role="img" aria-labelledby="title desc">
<title id="title">Tomato08 proposed architecture</title><desc id="desc">A public website and separate private workspace share managed HTTPS delivery. Sensitive requests use a server boundary and validated identity. Supabase provides authentication, row-protected Postgres, and private object storage. Later integrations use authenticated background jobs and external provider APIs. This target architecture is proposed and has not been deployed.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a5b6bc" stroke-width="1.3"/></marker><marker id="goldArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#d6b38b" stroke-width="1.3"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#eaece9}.title{font-family:Georgia,serif;font-size:40px}.section{font-size:14px;letter-spacing:2px;fill:#969ea7}.name{font-size:22px;font-weight:600}.body{font-size:17px;fill:#b4bcc5}.small{font-size:14px;fill:#9ca9b4}.box{fill:#222a32;stroke:#50636b;stroke-width:1.4}.planned{fill:#28292a;stroke:#ae8d67;stroke-width:1.5;stroke-dasharray:6 5}.flow{fill:none;stroke:#a5b6bc;stroke-width:1.5;marker-end:url(#arrow)}.later{fill:none;stroke:#d6b38b;stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#goldArrow)}.label{font-size:13px;fill:#a7b5bb}.existing{fill:#afd9c6}.gold{fill:#dec299}</style>
<rect width="1600" height="1030" fill="#121920"/>
<text x="60" y="65" class="section">TOMATO08 / ARCHITECTURE DECISION MAP</text>
<text x="60" y="121" class="title">One platform. Clear boundaries.</text>
<text x="60" y="156" class="body">Proposed target architecture · no infrastructure in this diagram was provisioned by this audit</text>
<rect x="55" y="201" width="425" height="670" rx="15" fill="#182028" stroke="#2f3e48"/>
<rect x="510" y="201" width="530" height="670" rx="15" fill="#1b2229" stroke="#3a424b"/>
<rect x="1070" y="201" width="475" height="670" rx="15" fill="#182523" stroke="#354d45"/>
<text x="80" y="239" class="section">DEVICE &amp; DELIVERY</text><text x="535" y="239" class="section">APPLICATION BOUNDARY</text><text x="1095" y="239" class="section">MANAGED DATA &amp; SERVICES</text>
<rect x="85" y="280" width="365" height="117" rx="9" class="box"/><text x="108" y="316" class="name">Browser / installed PWA</text><text x="108" y="346" class="body">Keyboard, touch and accessible UI</text><text x="108" y="373" class="small">Private offline data requires an explicit policy</text>
<path d="M267 397V467" class="flow"/><text x="281" y="436" class="label">HTTPS</text>
<rect x="85" y="469" width="365" height="150" rx="9" class="box"/><text x="108" y="506" class="name">DNS / TLS / CDN</text><text x="108" y="537" class="body">GitHub Pages exists today</text><text x="108" y="565" class="body">Evaluate managed edge delivery</text><text x="108" y="594" class="small">Cache public assets; never cache private API data</text>
<path d="M450 514H492V343H549" class="flow"/>
<path d="M450 565H549" class="flow"/>
<rect x="550" y="279" width="450" height="139" rx="9" class="planned"/><text x="576" y="317" class="name">Public collection / www</text><text x="576" y="348" class="body">Curated projects, writing and public tools</text><text x="576" y="379" class="small">Only explicitly published records and assets</text><text x="576" y="402" class="small">New design staged separately from the live site</text>
<rect x="550" y="467" width="450" height="149" rx="9" class="planned"/><text x="576" y="505" class="name">Private workspace / app</text><text x="576" y="536" class="body">Learning · Projects · Notes · later Everyday</text><text x="576" y="566" class="small">Shared shell, module registry and typed contracts</text><text x="576" y="592" class="small">Visible save, error and synchronization states</text>
<path d="M774 617V676" class="flow"/><text x="790" y="652" class="label">same-origin /api</text>
<rect x="550" y="679" width="450" height="150" rx="9" class="planned"/><text x="576" y="716" class="name">Validated server boundary</text><text x="576" y="747" class="body">Identity, permissions, quotas, validation</text><text x="576" y="777" class="small">Server-held integration tokens; secure sessions</text><text x="576" y="803" class="small">CSRF defense, sanitized logs and request IDs</text>
<rect x="1100" y="279" width="415" height="119" rx="9" class="box"/><text x="1125" y="316" class="name">Supabase Auth</text><text x="1125" y="347" class="body">Existing identity provider</text><text x="1125" y="375" class="small">Verify roles, recovery, MFA and session handling</text>
<rect x="1100" y="443" width="415" height="155" rx="9" class="box"/><text x="1125" y="481" class="name">Postgres + private Storage</text><text x="1125" y="512" class="body">Keep the existing learning data</text><text x="1125" y="542" class="small">RLS, grants and workspace membership</text><text x="1125" y="568" class="small">Versioned migrations and tested file policies</text><text x="1125" y="589" class="small">Independent database and object backups</text>
<path d="M1000 713H1050V339H1098" class="flow"/><text x="1059" y="426" transform="rotate(-90 1059 426)" class="label">verify caller</text>
<path d="M1000 754H1077V522H1098" class="flow"/>
<rect x="1100" y="643" width="415" height="185" rx="9" class="planned"/><text x="1125" y="681" class="name">Jobs + provider adapters</text><text x="1125" y="712" class="body">Calendar, files, GitHub, household APIs</text><text x="1125" y="742" class="small">Read-only scopes first; no browser credentials</text><text x="1125" y="768" class="small">Signed webhooks, idempotency, retries</text><text x="1125" y="794" class="small">Disconnect, revocation and visible job history</text><text x="1125" y="815" class="small">Reuse appropriate Supabase Edge workloads</text>
<path d="M1000 790H1098" class="later"/>
<rect x="85" y="675" width="365" height="152" rx="9" fill="#1d2730" stroke="#384751"/><text x="108" y="710" class="name">What is not needed yet</text><text x="108" y="742" class="body">Custom IP routing or home port forwarding</text><text x="108" y="770" class="body">Microservices or Kubernetes</text><text x="108" y="798" class="body">A second database or mandatory 3D UI</text>
<line x1="62" y1="914" x2="110" y2="914" stroke="#50636b" stroke-width="2"/><text x="125" y="920" class="small existing">Existing foundation retained; live policies still require verification</text>
<line x1="827" y1="914" x2="875" y2="914" stroke="#ae8d67" stroke-width="2" stroke-dasharray="6 5"/><text x="890" y="920" class="small gold">Proposed or extended capability, introduced in stages</text>
<text x="60" y="970" class="body">Release gates: identity + permissions → reliable saves → recovery → approved public/private experience → one integration at a time</text>
<text x="60" y="1002" class="small">See assessment.md for costs, milestones, source findings and acceptance criteria. September 10, 2026.</text>
</svg>
