<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flashcard Portal</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--blue:#2f81f7;--green:#238636}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
main{max-width:850px;margin:80px auto;padding:20px}
h1{text-align:center;margin:0 0 28px;font-size:30px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.choice{
  min-height:260px;border-radius:18px;text-decoration:none;color:white;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  font-weight:900;font-size:34px;border:1px solid rgba(255,255,255,.15)
}
.choice span{font-size:58px;margin-bottom:12px}
.tester{background:var(--blue)}
.developer{background:var(--green)}
.choice:hover{filter:brightness(1.08)}
@media(max-width:650px){.choices{grid-template-columns:1fr}.choice{min-height:190px}}
</style>
</head>
<body>
<main>
  <h1>Choose Mode</h1>
  <div class="choices">
    <a class="choice tester" href="./tester.html"><span>✓</span>TESTER</a>
    <a class="choice developer" href="./developer.html"><span>⚙</span>DEVELOPER</a>
  </div>
</main>
</body>
</html>
